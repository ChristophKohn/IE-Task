const JSONBIN_URL = "https://api.jsonbin.io/v3/b/" + JSONBIN_BIN_ID;
const POLL_INTERVAL_MS = 20000;

async function fetchState() {
  try {
    const res = await fetch(JSONBIN_URL + "/latest", { headers: { "X-Master-Key": JSONBIN_API_KEY } });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    const record = data.record || {};
    return { tasks: Array.isArray(record.tasks) ? record.tasks : [], team: Array.isArray(record.team) ? record.team : [] };
  } catch (e) {
    console.error("jsonbin GET fehlgeschlagen:", e);
    return null;
  }
}

async function saveState(state) {
  try {
    const res = await fetch(JSONBIN_URL, {
      method: "PUT",
      headers: { "Content-Type": "application/json", "X-Master-Key": JSONBIN_API_KEY },
      body: JSON.stringify(state),
    });
    return res.ok;
  } catch (e) {
    console.error("jsonbin PUT fehlgeschlagen:", e);
    return false;
  }
}

async function mutateState(mutator) {
  const current = await fetchState();
  const base = current || { tasks: [], team: [] };
  const next = mutator(base);
  const ok = await saveState(next);
  return ok ? next : null;
}

function fmtDate(iso) {
  if (!iso) return "—";
  const d = new Date(iso + "T00:00:00");
  return d.toLocaleDateString("de-DE", { day: "2-digit", month: "2-digit", year: "numeric" });
}

function isOverdue(iso, status) {
  if (!iso || status === "erledigt") return false;
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const d = new Date(iso + "T00:00:00");
  return d < today;
}

async function copyToClipboard(text) {
  try { await navigator.clipboard.writeText(text); return true; }
  catch (e) {
    try {
      const ta = document.createElement("textarea");
      ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.focus(); ta.select();
      document.execCommand("copy"); document.body.removeChild(ta);
      return true;
    } catch (e2) { return false; }
  }
}

function formatStr(str, vars) {
  if (!str) return "";
  return str.replace(/\{(\w+)\}/g, (_, k) => (vars && vars[k] !== undefined ? vars[k] : ""));
}

const LangContext = createContext({ lang: "de", setLang: () => {}, t: (k) => k, tf: (k) => k });
function useLang() { return useContext(LangContext); }

function LangProvider({ children }) {
  const [lang, setLangState] = useState(() => {
    try { return localStorage.getItem("ie_task_lang") || "de"; } catch (e) { return "de"; }
  });
  function setLang(code) {
    setLangState(code);
    try { localStorage.setItem("ie_task_lang", code); } catch (e) {}
  }
  const t = (key) => (TRANSLATIONS[lang] && TRANSLATIONS[lang][key]) || TRANSLATIONS.de[key] || key;
  const tf = (key, vars) => formatStr(t(key), vars);
  return (
    <LangContext.Provider value={{ lang, setLang, t, tf }}>
      {children}
    </LangContext.Provider>
  );
}

function LangSwitcher() {
  const { lang, setLang } = useLang();
  const [open, setOpen] = useState(false);
  const current = LANGS.find((l) => l.code === lang) || LANGS[0];
  return (
    <div className="lang-switcher">
      <button className="lang-btn" onClick={() => setOpen((o) => !o)}>
        <span className="lang-flag">{current.flag}</span>
        <span>{current.label}</span>
      </button>
      {open && (
        <div className="lang-menu">
          {LANGS.map((l) => (
            <button
              key={l.code}
              className={"lang-option" + (l.code === lang ? " active" : "")}
              onClick={() => { setLang(l.code); setOpen(false); }}
            >
              <span className="lang-flag">{l.flag}</span> {l.label}
            </button>
          ))}
        </div>
      )}
    </div>
  );
}

function SubitemChecklist({ task, onToggle }) {
  if (!task.subitems || task.subitems.length === 0) return null;
  const doneCount = task.subitems.filter((si) => si.done).length;
  return (
    <div className="subitems">
      <div className="subitems-progress">{doneCount}/{task.subitems.length}</div>
      {task.subitems.map((si) => (
        <label key={si.id} className="subitem-row">
          <input type="checkbox" checked={!!si.done} onChange={() => onToggle(task.id, si.id)} />
          <span className={si.done ? "subitem-done" : ""}>{si.text}</span>
        </label>
      ))}
    </div>
  );
}


function statusClass(t) {
  if (t.status === "erledigt") return "done";
  if (isOverdue(t.deadline, t.status)) return "overdue";
  return "open";
}

          let nextTeam = s.team.map((m) => {

            if (noAdminYet && m.name === "Kohn, Christoph") updated = { ...updated, admin: true };
            if (sarozNeedsPn && m.name === "Volodomyr, Saroz" && !updated.personalnummer) updated = { ...updated, personalnummer: "21278" };
            return updated;

            nextTeam = [...nextTeam, { name: "Rui, Liu", department: "", personalnummer: "111111", viewOnly: true }];
          }
          return { ...s, team: nextTeam };
        });
        if (fixed) currentTeam = fixed.team;

    setTasks(state.tasks);
    setTeam(currentTeam);

  }, []);

  }
  function removeSubitemField(idx) {
    setFormSubitems((prev) => prev.filter((_, i) => i !== idx));
  }

  async function shiftCategoryDistribution() {
    if (tasks.length === 0) { setFormError(t("errDistributionEmpty")); return; }
    setSaving(true);
    const weights = CATEGORY_OPTIONS.map(() => Math.random() ** 2 + 0.05);
    const weightSum = weights.reduce((a, b) => a + b, 0);
    const cumulative = [];
    let acc = 0;
    weights.forEach((w) => { acc += w / weightSum; cumulative.push(acc); });
    function pickCategory() {
      const r = Math.random();
      const idx = cumulative.findIndex((c) => r <= c);
      return CATEGORY_OPTIONS[idx === -1 ? CATEGORY_OPTIONS.length - 1 : idx];
    }
    const result = await mutateState((s) => ({ ...s, tasks: s.tasks.map((tk) => ({ ...tk, category: pickCategory() })) }));
    if (result) { setTasks(result.tasks); setTeam(result.team); }
    else { setFormError(t("errDistributionFailed")); }
    setSaving(false);
  }

  }

    }));
    if (result) { setTasks(result.tasks); setTeam(result.team); }
  }

  async function toggleSubitem(taskId, subitemId) {
    const result = await mutateState((s) => ({
      ...s,
      tasks: s.tasks.map((tk) => {
        if (tk.id !== taskId) return tk;
        const subitems = (tk.subitems || []).map((si) => (si.id === subitemId ? { ...si, done: !si.done } : si));
        const allDone = subitems.length > 0 && subitems.every((si) => si.done);
        return {
          ...tk,
          subitems,
          status: allDone ? "erledigt" : "offen",
          completedAt: allDone ? new Date().toISOString() : null,
        };
      }),
    }));
    if (result) { setTasks(result.tasks); setTeam(result.team); }
  }

    if (team.some((tm) => tm.name === name)) return;

    const result = await mutateState((s) => {

      return { ...s, team: [...s.team, { name, department, personalnummer, admin: newIsAdmin, viewOnly: newIsViewOnly }] };

      .seg { display: flex; gap: 4px; }
      .seg button { font-family: 'JetBrains Mono', monospace; font-size: 11.5px; border: 1px solid #DCDCD6; background: #fff; padding: 5px 10px; border-radius: 6px; cursor: pointer; color: #6b7580; }

      .stat-card { background: #fff; border: 1px solid #E3E3DD; border-radius: 12px; padding: 14px 16px; box-shadow: 0 1px 2px rgba(30,36,41,0.04); }
      .chart-card { background: #fff; border: 1px solid #E3E3DD; border-radius: 12px; padding: 14px 16px 6px; margin-bottom: 8px; box-shadow: 0 1px 2px rgba(30,36,41,0.04); }
      .stat-card .n { font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 32px; line-height: 1; }
      .stat-card .l { font-family: 'JetBrains Mono', monospace; font-size: 10.5px; letter-spacing: 1px; text-transform: uppercase; color: #8a929b; margin-top: 4px; }
      table.eval { width: 100%; border-collapse: collapse; background: #fff; border: 1px solid #E3E3DD; border-radius: 12px; overflow: hidden; margin-bottom: 22px; font-size: 13.5px; box-shadow: 0 1px 2px rgba(30,36,41,0.04); }
      table.eval th { background: #1E2429; color: #F4F4F1; text-align: left; padding: 9px 12px; font-family: 'Barlow Condensed', sans-serif; font-weight: 600; letter-spacing: 0.3px; }
      table.eval td { padding: 8px 12px; border-top: 1px solid #EDEDE9; }
      table.eval tr:hover td { background: #FAFAF7; }
      table.eval td.num { font-family: 'JetBrains Mono', monospace; }
      table.eval td.overdue-cell { color: #B23B1F; font-weight: 600; }
      .eval-title { font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 18px; margin: 20px 0 8px; }
      .link-copied { color: #2E7D53; font-family: 'JetBrains Mono', monospace; font-size: 12px; display: flex; align-items: center; gap: 4px; }
      .focus-shell { max-width: 480px; margin: 60px auto; }
      .lang-switcher { position: fixed; top: 14px; left: 14px; z-index: 200; }
      .lang-btn { display: flex; align-items: center; gap: 6px; background: #fff; border: 1px solid #DCDCD6; border-radius: 8px; padding: 7px 12px; font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 600; color: #1E2429; cursor: pointer; box-shadow: 0 1px 3px rgba(30,36,41,0.1); }
      .lang-btn:hover { background: #F0F0EC; }
      .lang-flag { font-size: 16px; }
      .lang-menu { margin-top: 4px; background: #fff; border: 1px solid #E3E3DD; border-radius: 8px; box-shadow: 0 6px 20px rgba(30,36,41,0.15); overflow: hidden; min-width: 140px; }
      .lang-option { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; border: none; background: transparent; padding: 8px 12px; font-family: 'Inter', sans-serif; font-size: 13px; color: #1E2429; cursor: pointer; }
      .lang-option:hover { background: #F0F0EC; }
      .lang-option.active { font-weight: 700; background: #EAF2F8; }
    `}</style>
  );

  const gateActive = !loading && team.length > 0 && authChecked && !me;

  if (gateActive) {
    return (
      <div className="wrap">
        {globalStyles}
        <LangSwitcher />
        <LocalFileWarning />
        <div className="focus-shell">
          <div className="header" style={{ justifyContent: "center", marginBottom: 28 }}>
            <div className="logo-mark">📋</div>
            <div className="header-text" style={{ flex: "unset" }}>
              <div className="eyebrow">IE Task Managment</div>
            </div>
          </div>
          <div className="form-card" style={{ maxWidth: 360, margin: "0 auto", boxShadow: "none", border: "1px solid #E3E3DD" }}>
            <h2 style={{ fontSize: 20 }}>{t("loginTitle")}</h2>
            <label>{t("personalnummerLabel")}</label>
            <input
              type="text" value={pnInput} onChange={(e) => setPnInput(e.target.value)}
              onKeyDown={(e) => { if (e.key === "Enter") loginWithPersonalnummer(); }}
              placeholder={t("personalnummerPlaceholder")} autoFocus
            />
            {pnError && <p style={{ fontSize: 12.5, color: "#B23B1F", marginTop: 8, fontWeight: 600 }}>{pnError}</p>}
            <div className="form-actions">
              <button type="button" className="btn btn-primary" style={{ width: "100%", justifyContent: "center" }} onClick={loginWithPersonalnummer}>{t("btnLogin")}</button>
            </div>
          </div>
        </div>
      </div>
    );
  }

  if (focusId) {
    const tk = tasks.find((x) => x.id === focusId);
    return (
      <div className="wrap">
        {globalStyles}
        <LangSwitcher />
        <LocalFileWarning />
        <div className="focus-shell">
          {loading ? (
            <div className="loading"><Icon name="loader" spin /> {t("loadingLabel")}</div>
          ) : !tk ? (
            <div className="empty">{t("taskNotFound")}</div>
          ) : (
            <div className={"card " + statusClass(tk)} style={{ marginBottom: 0 }}>
              {tk.status === "erledigt" && <Stamp />}
              <div className="eyebrow" style={{ marginBottom: 8 }}>{t("yourTaskLabel")}</div>
              <p className="task-title" style={{ fontSize: 26 }}>{tk.title}</p>
              {tk.description && <p className="task-desc">{tk.description}</p>}
              <div className="meta-row">
                <span className="pill assignee">{tk.assignee}</span>
                {tk.category && <span className="pill category">{tk.category}</span>}
                <span className={"pill " + (isOverdue(tk.deadline, tk.status) ? "overdue" : "")}>
                  <Icon name="calendarClock" /> {tf("deadlineLabel", { date: fmtDate(tk.deadline) })}
                </span>
              </div>
              <SubitemChecklist task={tk} onToggle={toggleSubitem} />
              {tk.status !== "erledigt" ? (
                tk.subitems && tk.subitems.length > 0 ? (
                  (me === tk.assignee || isAdmin) ? null : <p style={{ fontSize: 13, color: "#8a929b" }}>{t("errWrongAssignee")}</p>
                ) : me === tk.assignee ? (
                  <button className="btn btn-primary" style={{ width: "100%", justifyContent: "center" }} onClick={() => markDone(tk.id)}>
                    <Icon name="check" /> {t("btnConfirmDone")}
                  </button>
                ) : (
                  <p style={{ fontSize: 13, color: "#8a929b" }}>{t("errWrongAssignee")}</p>
                )
              ) : (
                <p style={{ color: "#2E7D53", fontSize: 13.5, fontFamily: "'JetBrains Mono', monospace" }}>
                  {tf("confirmedOn", { date: tk.completedAt ? new Date(tk.completedAt).toLocaleDateString("de-DE") : "—" })}
                </p>
              )}
            </div>
          )}
        </div>
      </div>
    );
  }

  return (
    <div className="wrap">
      {globalStyles}
      <LangSwitcher />
        <LocalFileWarning />
      <div className={"shell " + (role === "dashboard" ? "shell-wide" : "")}>
        <div className="header">
          <div className="logo-mark">📋</div>
          <div className="header-text">
            <div className="eyebrow">IE Task Managment</div>
            <h1>IE Task Managment</h1>
          </div>
          {me && <span className="pill assignee">{me}</span>}
          {me && <button className="btn btn-ghost btn-sm" onClick={logout}>{t("btnLogout")}</button>}
          <span className="refresh-dot" title={t("refreshTooltip")} onClick={() => refresh(true)}>
            <Icon name="refresh" spin={saving} />
          </span>
        </div>

        {loadError && <div className="error-note">{t("loadError")}</div>}

        <div className="shared-note">{tf("sharedNote", { sec: POLL_INTERVAL_MS / 1000 })}</div>

        <div className="tabs">
          {isAdmin && <button className={"tab " + (role === "manager" ? "active" : "")} onClick={() => setRole("manager")}><Icon name="clipboardList" /> {t("tabManager")}</button>}
          <button className={"tab " + (role === "auswertung" ? "active" : "")} onClick={() => setRole("auswertung")}><Icon name="users" /> {t("tabAuswertung")}</button>
          <button className={"tab " + (role === "dashboard" ? "active" : "")} onClick={() => setRole("dashboard")}><Icon name="layoutDashboard" /> {t("tabDashboard")}</button>
          <button className={"tab " + (role === "mitarbeiter" ? "active" : "")} onClick={() => setRole("mitarbeiter")}><Icon name="check" /> {t("tabMyTasks")}</button>
        </div>

        {loading ? (
          <div className="loading"><Icon name="loader" spin /> {t("loadingLabel")}</div>
        ) : role === "manager" && isAdmin ? (
          <>
            <div className="toolbar">
              <div className="seg">
                <button className={filter === "offen" ? "active" : ""} onClick={() => setFilter("offen")}>{t("filterOpen")}</button>
                <button className={filter === "alle" ? "active" : ""} onClick={() => setFilter("alle")}>{t("filterAll")}</button>
                <button className={filter === "erledigt" ? "active" : ""} onClick={() => setFilter("erledigt")}>{t("filterErledigt")}</button>
                <button className={filter === "ueberfaellig" ? "active" : ""} onClick={() => setFilter("ueberfaellig")}>{t("filterUeberfaellig")}</button>
              </div>
              <select
                value={assigneeFilter}
                onChange={(e) => setAssigneeFilter(e.target.value)}
                style={{ width: "auto", minWidth: 170 }}
              >
                <option value="">{t("filterAssigneeAll")}</option>
                {team.map((m) => (<option key={m.name} value={m.name}>{m.name}</option>))}
              </select>
              <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
                <button className="btn btn-ghost" onClick={() => setShowTeamEdit(true)}><Icon name="users" /> {t("btnTeam")}</button>
                <button className="btn btn-ghost" onClick={shiftCategoryDistribution} disabled={saving}><Icon name="refresh" /> {t("btnShiftDistribution")}</button>
                <button className="btn btn-ghost" onClick={exportExcel}><Icon name="download" /> {t("btnExcelExport")}</button>
                <button className="btn btn-primary" onClick={() => { setFormError(""); setShowForm(true); }}><Icon name="plus" /> {t("btnNewTask")}</button>
              </div>
            </div>

            {managerTasks.length === 0 ? (
              <div className="empty">{t("emptyNoTasks")}</div>
            ) : (
              managerTasks.map((tk) => (
                <div key={tk.id} className={"card " + statusClass(tk)}>
                  {tk.status === "erledigt" && <Stamp />}
                  <p className="task-title">{tk.title}</p>
                  {tk.description && <p className="task-desc">{tk.description}</p>}
                  <div className="meta-row">
                    <span className="pill assignee">{tk.assignee}</span>
                    <span className="pill dept">{departmentOf(tk.assignee)}</span>
                    {tk.category && <span className="pill category">{tk.category}</span>}
                    <span className={"pill " + (isOverdue(tk.deadline, tk.status) ? "overdue" : "")}>
                      <Icon name="calendarClock" /> {tf("deadlineLabel", { date: fmtDate(tk.deadline) })}
                    </span>
                  </div>
                  <SubitemChecklist task={tk} onToggle={toggleSubitem} />
                  <div className="row-between">
                    {copiedId === tk.id ? (
                      <span className="link-copied"><Icon name="clipboardCheck" /> {t("linkCopied")}</span>
                    ) : (
                      <button className="btn btn-ghost btn-sm" onClick={() => copyLink(tk.id)}><Icon name="link" /> {t("linkCopy")}</button>
                    )}
                    <button className="btn btn-danger-ghost btn-sm" onClick={() => deleteTask(tk.id)}><Icon name="trash" /> {t("btnDelete")}</button>
                  </div>
                </div>
              ))
            )}
          </>
        ) : role === "auswertung" ? (
          <Auswertung tasks={tasks} team={team} departmentOf={departmentOf} onExport={exportExcel} />
        ) : role === "dashboard" ? (
          <Dashboard tasks={tasks} team={team} departmentOf={departmentOf} isAdmin={isAdmin} canCreateTasks={canCreateTasks} onNewTask={() => { setFormError(""); setShowForm(true); }} />
        ) : (
          <>
            <>
                <div className="row-between" style={{ marginBottom: 14 }}>
                  <span className="pill assignee">{me}</span>
                  <button className="btn btn-ghost btn-sm" onClick={logout}>{t("btnLogout")}</button>
                </div>
                {myOpen.length === 0 && myDone.length === 0 && <div className="empty">{t("noTasksForYou")}</div>}
                {myOpen.map((tk) => (
                  <div key={tk.id} className={"card " + statusClass(tk)}>
                    <p className="task-title">{tk.title}</p>
                    {tk.description && <p className="task-desc">{tk.description}</p>}
                    <div className="meta-row">
                      {tk.category && <span className="pill category">{tk.category}</span>}
                      <span className={"pill " + (isOverdue(tk.deadline, tk.status) ? "overdue" : "")}>
                        <Icon name="calendarClock" /> {tf("deadlineLabel", { date: fmtDate(tk.deadline) })}
                      </span>
                    </div>
                    <SubitemChecklist task={tk} onToggle={toggleSubitem} />
                    {(!tk.subitems || tk.subitems.length === 0) && (
                      <div className="row-between">
                        <span></span>
                        <button className="btn btn-primary" onClick={() => markDone(tk.id)}><Icon name="check" /> {t("btnConfirmDone")}</button>
                      </div>
                    )}
                  </div>
                ))}
                {myDone.length > 0 && (
                  <>
                    <div className="eyebrow" style={{ margin: "18px 0 8px" }}>{t("doneSectionLabel")}</div>
                    {myDone.map((tk) => (
                      <div key={tk.id} className="card done">
                        <Stamp />
                        <p className="task-title">{tk.title}</p>
                        {tk.description && <p className="task-desc">{tk.description}</p>}
                        <div className="meta-row"><span className="pill">{tf("deadlineWas", { date: fmtDate(tk.deadline) })}</span></div>
                      </div>
                    ))}
                  </>
                )}
              </>
          </>
        )}
      </div>

      {showForm && (
        <div className="form-overlay" onClick={() => setShowForm(false)}>
          <div className="form-card" onClick={(e) => e.stopPropagation()}>
            <div className="row-between">
              <h2>{t("formNewTaskTitle")}</h2>
              <button className="btn btn-ghost" onClick={() => { setShowForm(false); setFormSubitems([""]); }}><Icon name="x" /></button>
            </div>
            <div>
              <label>{t("lblTitleField")}</label>
              <input value={form.title} onChange={(e) => setForm({ ...form, title: e.target.value })} onKeyDown={(e) => { if (e.key === "Enter") addTask(); }} />
              <label>{t("lblDescriptionField")}</label>
              <textarea value={form.description} onChange={(e) => setForm({ ...form, description: e.target.value })} />
              <label>{t("lblDeadlineField")}</label>
              <input type="date" value={form.deadline} onChange={(e) => setForm({ ...form, deadline: e.target.value })} />
              <label>{t("lblAssigneeField")}</label>
              <select value={form.assignee} onChange={(e) => setForm({ ...form, assignee: e.target.value })}>
                <option value="">{t("selectPlaceholder")}</option>
                {team.map((m) => (<option key={m.name} value={m.name}>{m.name} ({m.department})</option>))}
              </select>
              <label>{t("lblCategoryField")}</label>
              <select value={form.category} onChange={(e) => setForm({ ...form, category: e.target.value })}>
                <option value="">{t("selectPlaceholder")}</option>
                {CATEGORY_OPTIONS.map((c) => (<option key={c} value={c}>{c}</option>))}
              </select>
              <label>{t("lblSubitemsField")}</label>
              {formSubitems.map((val, idx) => (
                <div key={idx} className="subitem-field-row">
                  <input
                    value={val}
                    placeholder={t("subitemPlaceholder")}
                    onChange={(e) => updateSubitemField(idx, e.target.value)}
                    onKeyDown={(e) => { if (e.key === "Enter") { e.preventDefault(); addSubitemField(); } }}
                  />
                  <button type="button" className="btn btn-ghost btn-sm" onClick={() => removeSubitemField(idx)}><Icon name="x" /></button>
                </div>
              ))}
              <button type="button" className="btn btn-ghost btn-sm" onClick={addSubitemField} style={{ marginBottom: 6 }}><Icon name="plus" /> {t("btnAddSubitem")}</button>
              {team.length === 0 && <p style={{ fontSize: 12, color: "#B23B1F", marginTop: 6 }}>{t("noTeamFormMsg")}</p>}
              {formError && <p style={{ fontSize: 12.5, color: "#B23B1F", marginTop: 10, fontWeight: 600 }}>{formError}</p>}
              <p style={{ fontSize: 12, color: "#8a929b", marginTop: 10 }}>{t("copyHintMsg")}</p>
              <div className="form-actions">
                <button type="button" className="btn btn-ghost" onClick={() => { setShowForm(false); setFormError(""); setFormSubitems([""]); }}>{t("btnCancel")}</button>
                <button type="button" className="btn btn-primary" disabled={saving} onClick={addTask}>{saving ? t("btnSaving") : t("btnCreateTask")}</button>
              </div>
            </div>
          </div>
        </div>
      )}

      {showTeamEdit && (
        <div className="form-overlay" onClick={() => setShowTeamEdit(false)}>
          <div className="form-card" onClick={(e) => e.stopPropagation()}>
            <div className="row-between">
              <h2>{t("teamModalTitle")}</h2>
              <button className="btn btn-ghost" onClick={() => setShowTeamEdit(false)}><Icon name="x" /></button>
            </div>
            <button type="button" className="btn btn-ghost btn-sm" style={{ marginTop: 8 }} onClick={loadOfficialRoster}>{t("btnLoadRoster")}</button>
            <div className="form-row-2" style={{ marginTop: 12 }}>
              <div><input placeholder={t("placeholderName")} value={newName} onChange={(e) => setNewName(e.target.value)} onKeyDown={(e) => { if (e.key === "Enter") addTeamMember(); }} /></div>
              <div><input placeholder={t("placeholderDept")} value={newDept} onChange={(e) => setNewDept(e.target.value)} onKeyDown={(e) => { if (e.key === "Enter") addTeamMember(); }} /></div>
            </div>
            <div className="form-row-2" style={{ marginTop: 8 }}>
              <div><input placeholder={t("placeholderPersonalnummer")} value={newPersNr} onChange={(e) => setNewPersNr(e.target.value)} onKeyDown={(e) => { if (e.key === "Enter") addTeamMember(); }} /></div>
              <button type="button" className="btn btn-primary" style={{ alignSelf: "stretch" }} onClick={addTeamMember}><Icon name="plus" /></button>
            </div>
            <label style={{ display: "flex", alignItems: "center", gap: 6, marginTop: 10, textTransform: "none", fontWeight: 500, cursor: "pointer" }}>
              <input type="checkbox" style={{ width: "auto" }} checked={newIsAdmin} onChange={(e) => setNewIsAdmin(e.target.checked)} />
              {t("adminCheckboxLabel")}
            </label>
            <label style={{ display: "flex", alignItems: "center", gap: 6, marginTop: 6, textTransform: "none", fontWeight: 500, cursor: "pointer" }}>
              <input type="checkbox" style={{ width: "auto" }} checked={newIsViewOnly} onChange={(e) => setNewIsViewOnly(e.target.checked)} />
              {t("viewOnlyCheckboxLabel")}
            </label>
            <div className="team-list">
              {team.map((m) => (
                <div key={m.name} className="team-row">
                  <div className="info">
                    <span>{m.name}</span><span className="dept">{m.department}</span><span className="dept">{tf("persNrDisplay", { nr: m.personalnummer || "—" })}</span>
                    {m.admin && <span className="pill category">{t("adminBadge")}</span>}
                    {m.viewOnly && <span className="pill overdue">{t("viewOnlyBadge")}</span>}
                  </div>
                  <div style={{ display: "flex", gap: 4, alignItems: "center", flexWrap: "wrap" }}>
                    <button className="btn btn-ghost btn-sm" style={{ padding: "4px 8px", fontSize: 11 }} onClick={() => toggleAdmin(m.name)}>
                      {m.admin ? t("btnRemoveAdmin") : t("btnMakeAdmin")}
                    </button>
                    <button className="btn btn-ghost btn-sm" style={{ padding: "4px 8px", fontSize: 11 }} onClick={() => toggleViewOnly(m.name)}>
                      {m.viewOnly ? t("btnRemoveViewOnly") : t("btnMakeViewOnly")}
                    </button>
                    <button onClick={() => removeTeamMember(m.name)}><Icon name="x" /></button>
                  </div>
                </div>
              ))}
              {team.length === 0 && <p style={{ fontSize: 13, color: "#8a929b" }}>{t("noOneYet")}</p>}
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

function computeAggregates(tasks, team, departmentOf) {
  const totalOffen = tasks.filter((t) => t.status !== "erledigt").length;
  const totalErledigt = tasks.filter((t) => t.status === "erledigt").length;
  const totalUeberfaellig = tasks.filter((t) => isOverdue(t.deadline, t.status)).length;
  const totalGesamt = tasks.length;
  const perMA = {};
  team.forEach((m) => { perMA[m.name] = { department: m.department, offen: 0, erledigt: 0, ueberfaellig: 0 }; });
  tasks.forEach((t) => {
    if (!perMA[t.assignee]) perMA[t.assignee] = { department: departmentOf(t.assignee), offen: 0, erledigt: 0, ueberfaellig: 0 };
    if (t.status === "erledigt") perMA[t.assignee].erledigt++; else perMA[t.assignee].offen++;
    if (isOverdue(t.deadline, t.status)) perMA[t.assignee].ueberfaellig++;
  });
  const perDept = {};
  Object.values(perMA).forEach((v) => {
    const d = v.department || "—";
    if (!perDept[d]) perDept[d] = { offen: 0, erledigt: 0, ueberfaellig: 0 };
    perDept[d].offen += v.offen; perDept[d].erledigt += v.erledigt; perDept[d].ueberfaellig += v.ueberfaellig;
  });
  const perCategory = {};
  tasks.forEach((t) => {
    const c = t.category || "Ohne Zuordnung";
    if (!perCategory[c]) perCategory[c] = { offen: 0, erledigt: 0, ueberfaellig: 0 };
    if (t.status === "erledigt") perCategory[c].erledigt++; else perCategory[c].offen++;
    if (isOverdue(t.deadline, t.status)) perCategory[c].ueberfaellig++;
  });
  return { totalOffen, totalErledigt, totalUeberfaellig, totalGesamt, perMA, perDept, perCategory };
}

function pct(n, total) { if (!total) return "–"; return Math.round((n / total) * 100) + "%"; }

const COL_ERLEDIGT = "#2E7D53";
const COL_OFFEN = "#3B5169";
const COL_UEBERFAELLIG = "#B23B1F";

function Auswertung({ tasks, team, departmentOf, onExport }) {
  const { t } = useLang();
  const { totalOffen, totalErledigt, totalUeberfaellig, totalGesamt, perMA, perDept, perCategory } = computeAggregates(tasks, team, departmentOf);
  return (
    <div>
      <div className="toolbar">
        <span className="eyebrow">{t("standLabel")} {new Date().toLocaleString("de-DE")}</span>
        <button className="btn btn-primary" onClick={onExport}><Icon name="download" /> {t("btnExportExcelFull")}</button>
      </div>
      <div className="stat-grid">
        <div className="stat-card"><div className="n">{totalOffen}</div><div className="l">{t("lblOpen")} · {pct(totalOffen, totalGesamt)}</div></div>
        <div className="stat-card"><div className="n">{totalErledigt}</div><div className="l">{t("lblDone")} · {pct(totalErledigt, totalGesamt)}</div></div>
        <div className="stat-card"><div className="n" style={{ color: totalUeberfaellig > 0 ? "#B23B1F" : "#1E2429" }}>{totalUeberfaellig}</div><div className="l">{t("lblOverdue")} · {pct(totalUeberfaellig, totalGesamt)}</div></div>
      </div>
      <div className="eval-title" style={{ marginTop: 4 }}>{t("sectionPerEmployee")}</div>
      <table className="eval">
        <thead><tr><th>{t("lblEmployee")}</th><th>{t("lblDepartment")}</th><th>{t("lblTotal")}</th><th>{t("lblOpen")}</th><th>{t("lblDone")}</th><th>{t("lblOverdue")}</th></tr></thead>
        <tbody>
          {Object.entries(perMA).length === 0 && (<tr><td colSpan={6} style={{ color: "#8a929b" }}>{t("noTeamMsg")}</td></tr>)}
          {Object.entries(perMA).map(([name, v]) => {
            const g = v.offen + v.erledigt;
            return (
              <tr key={name}>
                <td>{name}</td><td>{v.department}</td><td className="num">{g}</td>
                <td className="num">{v.offen} <span style={{ color: "#8a929b" }}>({pct(v.offen, g)})</span></td>
                <td className="num">{v.erledigt} <span style={{ color: "#8a929b" }}>({pct(v.erledigt, g)})</span></td>
                <td className={"num " + (v.ueberfaellig > 0 ? "overdue-cell" : "")}>{v.ueberfaellig} <span style={{ color: v.ueberfaellig > 0 ? "#B23B1F" : "#8a929b" }}>({pct(v.ueberfaellig, g)})</span></td>
              </tr>
            );
          })}
        </tbody>
      </table>
      <div className="eval-title">{t("sectionPerDept")}</div>
      <table className="eval">
        <thead><tr><th>{t("lblDepartment")}</th><th>{t("lblTotal")}</th><th>{t("lblOpen")}</th><th>{t("lblDone")}</th><th>{t("lblOverdue")}</th></tr></thead>
        <tbody>
          {Object.entries(perDept).length === 0 && (<tr><td colSpan={5} style={{ color: "#8a929b" }}>{t("noTeamMsg")}</td></tr>)}
          {Object.entries(perDept).map(([dept, v]) => {
            const g = v.offen + v.erledigt;
            return (
              <tr key={dept}>
                <td>{dept}</td><td className="num">{g}</td>
                <td className="num">{v.offen} <span style={{ color: "#8a929b" }}>({pct(v.offen, g)})</span></td>
                <td className="num">{v.erledigt} <span style={{ color: "#8a929b" }}>({pct(v.erledigt, g)})</span></td>
                <td className={"num " + (v.ueberfaellig > 0 ? "overdue-cell" : "")}>{v.ueberfaellig} <span style={{ color: v.ueberfaellig > 0 ? "#B23B1F" : "#8a929b" }}>({pct(v.ueberfaellig, g)})</span></td>
              </tr>
            );
          })}
        </tbody>
      </table>
      <div className="eval-title">{t("sectionPerCategory")}</div>
      <table className="eval">
        <thead><tr><th>{t("lblCategory")}</th><th>{t("lblTotal")}</th><th>{t("lblOpen")}</th><th>{t("lblDone")}</th><th>{t("lblOverdue")}</th></tr></thead>
        <tbody>
          {Object.entries(perCategory).length === 0 && (<tr><td colSpan={5} style={{ color: "#8a929b" }}>{t("noTasksMsg")}</td></tr>)}
          {Object.entries(perCategory).map(([cat, v]) => {
            const g = v.offen + v.erledigt;
            return (
              <tr key={cat}>
                <td>{cat}</td><td className="num">{g}</td>
                <td className="num">{v.offen} <span style={{ color: "#8a929b" }}>({pct(v.offen, g)})</span></td>
                <td className="num">{v.erledigt} <span style={{ color: "#8a929b" }}>({pct(v.erledigt, g)})</span></td>
                <td className={"num " + (v.ueberfaellig > 0 ? "overdue-cell" : "")}>{v.ueberfaellig} <span style={{ color: v.ueberfaellig > 0 ? "#B23B1F" : "#8a929b" }}>({pct(v.ueberfaellig, g)})</span></td>
              </tr>
            );
          })}
        </tbody>
      </table>
    </div>
  );
}

function toStackData(obj, t) {
  return Object.entries(obj).map(([name, v]) => ({
    name, [t("lblDone")]: v.erledigt, [t("lblOpenInPlan")]: v.offen - v.ueberfaellig, [t("lblOverdue")]: v.ueberfaellig,
  }));
}

function MiniDonut({ data, total, centerLabel }) {
  const size = 160; const r = 60; const circumference = 2 * Math.PI * r; let cumulative = 0;
  return (
    <div style={{ display: "flex", alignItems: "center", gap: 24, flexWrap: "wrap" }}>
      <svg width={size} height={size} viewBox="0 0 160 160">
        <circle cx="80" cy="80" r={r} fill="none" stroke="#EDEDE9" strokeWidth="20" />
        {data.map((d) => {
          const frac = total ? d.value / total : 0;
          const len = frac * circumference;
          const dashArray = len + " " + (circumference - len);
          const dashOffset = -cumulative;
          cumulative += len;
          return <circle key={d.name} cx="80" cy="80" r={r} fill="none" stroke={d.color} strokeWidth="20" strokeDasharray={dashArray} strokeDashoffset={dashOffset} transform="rotate(-90 80 80)" strokeLinecap="butt" />;
        })}
        <text x="80" y="76" textAnchor="middle" fontFamily="Barlow Condensed, sans-serif" fontWeight="700" fontSize="30" fill="#1E2429">{total}</text>
        <text x="80" y="96" textAnchor="middle" fontFamily="JetBrains Mono, monospace" fontSize="10.5" fill="#8a929b">{centerLabel}</text>
      </svg>
      <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
        {data.map((d) => (
          <div key={d.name} style={{ display: "flex", alignItems: "center", gap: 8, fontSize: 13.5 }}>
            <span style={{ width: 12, height: 12, borderRadius: 3, background: d.color, display: "inline-block", flexShrink: 0 }} />
            <span>{d.name}</span>
            <span style={{ fontFamily: "JetBrains Mono, monospace", fontSize: 12, color: "#8a929b" }}>{d.value} ({pct(d.value, total)})</span>
          </div>
        ))}
      </div>
    </div>
  );
}

function VerticalStackedBars({ data, keyNames }) {
  const keys = [
    { key: keyNames.done, color: COL_ERLEDIGT },
    { key: keyNames.openInPlan, color: COL_OFFEN },
    { key: keyNames.overdue, color: COL_UEBERFAELLIG },
  ];
  function totalOf(row) { return keys.reduce((s, k) => s + row[k.key], 0); }
  const sorted = [...data].sort((a, b) => totalOf(b) - totalOf(a));
  const max = Math.max(1, ...sorted.map(totalOf));
  const chartHeight = 170;
  return (
    <div style={{ display: "flex", alignItems: "flex-end", gap: 22, overflowX: "auto", padding: "0 4px", height: chartHeight + 56 }}>
      {sorted.map((row) => {
        const total = totalOf(row);
        return (
          <div key={row.name} style={{ display: "flex", flexDirection: "column", alignItems: "center", minWidth: 74 }}>
            <div style={{ fontSize: 11, fontFamily: "'JetBrains Mono', monospace", color: "#8a929b", marginBottom: 4 }}>{total}</div>
            <div style={{ display: "flex", flexDirection: "column-reverse", width: 34, height: chartHeight, borderRadius: "6px 6px 3px 3px", overflow: "hidden", background: "#EDEDE9" }}>
              {keys.map((k) => row[k.key] > 0 && (
                <div key={k.key} title={k.key + ": " + row[k.key]} style={{ height: (row[k.key] / max) * chartHeight + "px", background: k.color }} />
              ))}
            </div>
            <div style={{ fontSize: 11.5, fontWeight: 600, marginTop: 6, textAlign: "center", maxWidth: 90, wordBreak: "break-word" }}>{row.name}</div>
          </div>
        );
      })}
    </div>
  );
}

function RankedBars({ data, keyNames }) {
  const keys = [
    { key: keyNames.done, color: COL_ERLEDIGT },
    { key: keyNames.openInPlan, color: COL_OFFEN },
    { key: keyNames.overdue, color: COL_UEBERFAELLIG },
  ];
  function totalOf(row) { return keys.reduce((s, k) => s + row[k.key], 0); }
  const sorted = [...data].sort((a, b) => totalOf(b) - totalOf(a));
  const max = Math.max(1, ...sorted.map(totalOf));
  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
      {sorted.map((row) => {
        const total = totalOf(row);
        return (
          <div key={row.name}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", fontSize: 13, marginBottom: 5 }}>
              <span style={{ fontWeight: 600 }}>{row.name}</span>
              <span style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 12, color: "#8a929b" }}>{total}</span>
            </div>
            <div style={{ display: "flex", height: 16, borderRadius: 8, overflow: "hidden", background: "#EDEDE9", width: "100%" }}>
              {keys.map((k) => row[k.key] > 0 && (
                <div key={k.key} title={k.key + ": " + row[k.key]} style={{ width: (row[k.key] / max) * 100 + "%", background: k.color }} />
              ))}
            </div>
          </div>
        );
      })}
    </div>
  );
}

function ChartLegend({ items }) {
  return (
    <div style={{ display: "flex", gap: 14, flexWrap: "wrap", marginBottom: 12, fontSize: 12 }}>
      {items.map((it) => (
        <div key={it.label} style={{ display: "flex", alignItems: "center", gap: 5 }}>
          <span style={{ width: 10, height: 10, borderRadius: 3, background: it.color, display: "inline-block" }} />
          <span style={{ color: "#46505a" }}>{it.label}</span>
        </div>
      ))}
    </div>
  );
}

function Dashboard({ tasks, team, departmentOf, onNewTask, isAdmin, canCreateTasks }) {
  const { t, tf, lang } = useLang();
  const { totalGesamt, totalErledigt, totalOffen, totalUeberfaellig, perMA, perDept, perCategory } = computeAggregates(tasks, team, departmentOf);

  const donutData = [
    { name: t("lblDone"), value: totalErledigt, color: COL_ERLEDIGT },
    { name: t("lblOpenInPlan"), value: totalOffen - totalUeberfaellig, color: COL_OFFEN },
    { name: t("lblOverdue"), value: totalUeberfaellig, color: COL_UEBERFAELLIG },
  ].filter((d) => d.value > 0);

  const keyNames = { done: t("lblDone"), openInPlan: t("lblOpenInPlan"), overdue: t("lblOverdue") };
  const maChartData = toStackData(perMA, t);
  const deptChartData = toStackData(perDept, t);
  const catChartData = toStackData(perCategory, t);
  const legendItems = [
    { label: t("lblDone"), color: COL_ERLEDIGT },
    { label: t("lblOpenInPlan"), color: COL_OFFEN },
    { label: t("lblOverdue"), color: COL_UEBERFAELLIG },
  ];

  function daysOverdue(deadline) {
    const today = new Date(); today.setHours(0, 0, 0, 0);
    const d = new Date(deadline + "T00:00:00");
    return Math.round((today - d) / 86400000);
  }
  const topOverdue = tasks.filter((t2) => isOverdue(t2.deadline, t2.status)).map((t2) => ({ ...t2, daysLate: daysOverdue(t2.deadline) })).sort((a, b) => b.daysLate - a.daysLate).slice(0, 3);

  function dayText(n) {
    if (lang === "de") return n + " Tag" + (n === 1 ? "" : "e");
    if (lang === "zh") return n + " 天";
    return n + " day" + (n === 1 ? "" : "s");
  }

  if (totalGesamt === 0) {
    return (
      <div>
        {canCreateTasks && (
          <div className="toolbar" style={{ justifyContent: "flex-end" }}>
            <button className="btn btn-primary" onClick={onNewTask}><Icon name="plus" /> {t("btnNewTask")}</button>
          </div>
        )}
        <div className="empty">{t("dashboardEmpty")}</div>
      </div>
    );
  }

  return (
    <div style={{ minHeight: "calc(100vh - 230px)" }}>
      {canCreateTasks && (
        <div className="toolbar" style={{ justifyContent: "flex-end" }}>
          <button className="btn btn-primary" onClick={onNewTask}><Icon name="plus" /> {t("btnNewTask")}</button>
        </div>
      )}

      <div className="dashboard-row" style={{ marginBottom: 12 }}>
        <div className="chart-card">
          <div className="eval-title" style={{ marginTop: 0 }}>{t("overallDistribution")}</div>
          <MiniDonut data={donutData} total={totalGesamt} centerLabel={t("totalCenter")} />
        </div>

        {topOverdue.length > 0 && (
          <div className="chart-card top-overdue-card">
            <div style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 10.5, letterSpacing: 1, textTransform: "uppercase", color: "#B23B1F", marginBottom: 10 }}>
              {tf("topOverdueLabel", { n: topOverdue.length })}
            </div>
            <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
              {topOverdue.map((tk, i) => (
                <div key={tk.id} style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 10, background: "#FCEDE9", border: "1px solid #E7B3A3", borderRadius: 8, padding: "7px 11px" }}>
                  <div style={{ minWidth: 0 }}>
                    <div style={{ fontWeight: 600, fontSize: 13.5, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{i + 1}. {tk.title}</div>
                    <div style={{ fontSize: 11.5, color: "#8a5a1f" }}>{tk.assignee} · {tf("deadlineLabel", { date: fmtDate(tk.deadline) })}</div>
                  </div>
                  <div style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 13, fontWeight: 700, color: "#B23B1F", whiteSpace: "nowrap" }}>{dayText(tk.daysLate)}</div>
                </div>
              ))}
            </div>
          </div>
        )}
      </div>

      {maChartData.length > 0 && (
        <div className="chart-card">
          <div className="eval-title" style={{ marginTop: 0 }}>{t("sectionPerEmployee")}</div>
          <ChartLegend items={legendItems} />
          <RankedBars data={maChartData} keyNames={keyNames} />
        </div>
      )}

      {deptChartData.length > 0 && (
        <div className="chart-card">
          <div className="eval-title" style={{ marginTop: 0 }}>{t("sectionPerDept")}</div>
          <ChartLegend items={legendItems} />
          <VerticalStackedBars data={deptChartData} keyNames={keyNames} />
        </div>
      )}

      {catChartData.length > 0 && (
        <div className="chart-card">
          <div className="eval-title" style={{ marginTop: 0 }}>{t("sectionPerCategory")}</div>
          <ChartLegend items={legendItems} />
          <VerticalStackedBars data={catChartData} keyNames={keyNames} />
        </div>
      )}
    </div>
  );
}

class ErrorBoundary extends React.Component {
  constructor(props) { super(props); this.state = { error: null }; }
  static getDerivedStateFromError(error) { return { error }; }
  componentDidCatch(error, info) { console.error("App-Fehler:", error, info); }
  render() {
    if (this.state.error) {
      return (
        <div style={{ padding: 24, fontFamily: "sans-serif", background: "#FCEDE9", color: "#7A2515", minHeight: "100vh" }}>
          <h2 style={{ marginTop: 0 }}>Es ist ein Fehler aufgetreten</h2>
          <p style={{ fontFamily: "monospace", fontSize: 13, whiteSpace: "pre-wrap" }}>{String(this.state.error && this.state.error.message ? this.state.error.message : this.state.error)}</p>
          <button onClick={() => window.location.reload()} style={{ padding: "8px 16px", borderRadius: 6, border: "none", background: "#B23B1F", color: "#fff", cursor: "pointer", fontWeight: 600 }}>Neu laden</button>
        </div>
      );
    }
    return this.props.children;
  }
}

function GlobalErrorBanner() {
  const [msg, setMsg] = React.useState(null);
  React.useEffect(() => {
    function onError(e) { setMsg(e.message || String(e.error || e)); }
    function onRejection(e) { const reason = e.reason; setMsg(reason && reason.message ? reason.message : String(reason)); }
    window.addEventListener("error", onError);
    window.addEventListener("unhandledrejection", onRejection);
    return () => { window.removeEventListener("error", onError); window.removeEventListener("unhandledrejection", onRejection); };
  }, []);
  if (!msg) return null;
  return (
    <div style={{ position: "fixed", top: 0, left: 0, right: 0, zIndex: 999, background: "#B23B1F", color: "#fff", padding: "10px 16px", fontFamily: "monospace", fontSize: 12.5, display: "flex", justifyContent: "space-between", alignItems: "center", gap: 12 }}>
      <span>Technischer Fehler: {msg}</span>
      <button onClick={() => setMsg(null)} style={{ background: "transparent", border: "1px solid #fff", color: "#fff", borderRadius: 4, padding: "2px 8px", cursor: "pointer" }}>Ausblenden</button>
    </div>
  );
}

function App() {
  return (
    <LangProvider>
      <ErrorBoundary>
        <GlobalErrorBanner />
        <AppInner />
      </ErrorBoundary>
    </LangProvider>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
